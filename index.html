<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTE - Crítica Tu Escuela | Panamá</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              900: '#14532d',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-black text-white font-sans antialiased selection:bg-white selection:text-black">

  <!-- CONTENEDOR PRINCIPAL -->
  <div id="app" class="min-h-screen flex flex-col justify-between">
    
    <!-- ENCABEZADO -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-black/80 border-b border-neutral-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-white text-black font-black flex items-center justify-center rounded-lg text-xl tracking-tighter">
          CTE
        </div>
        <span class="font-bold text-lg tracking-wide hidden sm:inline">Crítica Tu Escuela</span>
      </div>

      <div id="user-nav" class="flex items-center space-x-3">
        <!-- Render dinámico según sesión -->
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-6">

      <!-- MODAL DE AUTENTICACIÓN -->
      <section id="auth-section" class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex border-b border-neutral-800 mb-6">
          <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 pb-3 font-bold border-b-2 border-white text-white">Iniciar Sesión</button>
          <button id="tab-register-btn" onclick="switchAuthTab('register')" class="flex-1 pb-3 font-bold border-b-2 border-transparent text-neutral-500 hover:text-neutral-300">Registrarse</button>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Nombre de Usuario o Correo</label>
            <input type="text" id="login-user" required placeholder="Tu usuario o correo" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-white transition">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Contraseña</label>
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-white transition">
          </div>
          <button type="submit" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-neutral-200 transition">Entrar</button>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Nombre de Usuario</label>
            <input type="text" id="reg-username" required placeholder="estudiante123" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-white transition">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Correo Electrónico</label>
            <input type="email" id="reg-email" required placeholder="correo@ejemplo.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-white transition">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-neutral-400 mb-1">Contraseña</label>
            <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-white transition">
          </div>
          <button type="submit" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-neutral-200 transition">Crear Cuenta</button>
        </form>

        <div id="auth-error" class="hidden mt-4 p-3 bg-red-950/50 border border-red-800 rounded-xl text-red-400 text-xs text-center font-medium"></div>
      </section>

      <!-- FEED DE PUBLICACIONES -->
      <section id="feed-section" class="space-y-6 hidden">
        <!-- CREAR PUBLICACIÓN -->
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-3">
          <textarea id="post-content" rows="3" placeholder="¿Qué está pasando en tu escuela?..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white resize-none"></textarea>
          <div class="flex items-center justify-between pt-2">
            <label class="flex items-center space-x-2 text-xs text-neutral-400 cursor-pointer">
              <input type="checkbox" id="post-anonymous" class="rounded bg-neutral-950 border-neutral-800 text-white focus:ring-0">
              <span>Publicar de forma anónima</span>
            </label>
            <button onclick="submitPost()" class="bg-white text-black px-5 py-2 rounded-xl text-xs font-bold hover:bg-neutral-200 transition">Publicar</button>
          </div>
        </div>

        <!-- LISTA DE PUBLICACIONES -->
        <div id="posts-container" class="space-y-4"></div>
      </section>

    </main>

  </div>

  <script>
    // BASE DE DATOS GLOBAL Y NUBE SIMPLIFICADA
    let currentUser = JSON.parse(localStorage.getItem('cte_current_user')) || null;
    let usersDB = JSON.parse(localStorage.getItem('cte_users_db')) || [];
    let postsDB = JSON.parse(localStorage.getItem('cte_posts_db')) || [
      { author: "@admin_cte", time: "Hace un momento", content: "¡Bienvenidos a CTE Panama! Tu red para evaluar escuelas de forma libre." }
    ];

    // CAMBIO DE PESTAÑAS
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-register-btn');
      const errorDiv = document.getElementById('auth-error');

      errorDiv.classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        loginBtn.className = "flex-1 pb-3 font-bold border-b-2 border-white text-white";
        regBtn.className = "flex-1 pb-3 font-bold border-b-2 border-transparent text-neutral-500 hover:text-neutral-300";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        regBtn.className = "flex-1 pb-3 font-bold border-b-2 border-white text-white";
        loginBtn.className = "flex-1 pb-3 font-bold border-b-2 border-transparent text-neutral-500 hover:text-neutral-300";
      }
    }

    // REGISTRO SIMPLE
    function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim().toLowerCase();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-password').value;
      const errorDiv = document.getElementById('auth-error');

      errorDiv.classList.add('hidden');

      if (password.length < 6) {
        errorDiv.textContent = "La contraseña debe tener al menos 6 caracteres.";
        errorDiv.classList.remove('hidden');
        return;
      }

      const userExists = usersDB.find(u => u.username === username || u.email === email);
      if (userExists) {
        errorDiv.textContent = "El usuario o correo ya está registrado. Intenta iniciar sesión.";
        errorDiv.classList.remove('hidden');
        return;
      }

      const newUser = { username, email, password };
      usersDB.push(newUser);
      localStorage.setItem('cte_users_db', JSON.stringify(usersDB));

      currentUser = newUser;
      localStorage.setItem('cte_current_user', JSON.stringify(currentUser));
      updateUI();
    }

    // INICIO DE SESIÓN
    function handleLogin(e) {
      e.preventDefault();
      const userOrEmail = document.getElementById('login-user').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('auth-error');

      errorDiv.classList.add('hidden');

      const user = usersDB.find(u => (u.username === userOrEmail || u.email === userOrEmail) && u.password === password);

      if (!user) {
        errorDiv.textContent = "Usuario o contraseña incorrectos.";
        errorDiv.classList.remove('hidden');
        return;
      }

      currentUser = user;
      localStorage.setItem('cte_current_user', JSON.stringify(currentUser));
      updateUI();
    }

    // CERRAR SESIÓN
    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('cte_current_user');
      updateUI();
    }

    // CREAR PUBLICACIÓN
    function submitPost() {
      const content = document.getElementById('post-content').value.trim();
      const isAnon = document.getElementById('post-anonymous').checked;

      if (!content) return;

      const newPost = {
        author: isAnon ? "Anónimo" : `@${currentUser.username}`,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        content: content
      };

      postsDB.unshift(newPost);
      localStorage.setItem('cte_posts_db', JSON.stringify(postsDB));

      document.getElementById('post-content').value = '';
      document.getElementById('post-anonymous').checked = false;
      renderPosts();
    }

    // RENDERIZAR PUBLICACIONES
    function renderPosts() {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';
      postsDB.forEach(post => {
        const card = document.createElement('div');
        card.className = "bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-2";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-white">${post.author}</span>
            <span class="text-[10px] text-neutral-500">${post.time}</span>
          </div>
          <p class="text-sm text-neutral-200 leading-relaxed">${post.content}</p>
        `;
        container.appendChild(card);
      });
    }

    // ACTUALIZAR INTERFAZ
    function updateUI() {
      const authSection = document.getElementById('auth-section');
      const feedSection = document.getElementById('feed-section');
      const userNav = document.getElementById('user-nav');

      if (currentUser) {
        userNav.innerHTML = `
          <span class="text-xs font-bold text-neutral-300">@${currentUser.username}</span>
          <button onclick="handleLogout()" class="bg-neutral-800 text-white px-3 py-1.5 rounded-lg text-xs hover:bg-neutral-700 transition">Salir</button>
        `;
        authSection.classList.add('hidden');
        feedSection.classList.remove('hidden');
        renderPosts();
      } else {
        userNav.innerHTML = '';
        authSection.classList.remove('hidden');
        feedSection.classList.add('hidden');
      }
    }

    // INICIALIZAR
    updateUI();
  </script>
</body>
</html>
